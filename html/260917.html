      circle(x,y,19,'rgba(255,171,91,.17)');pc.restore();circle(x,y,9,'#ffab5b');pc.strokeStyle='#a96924';pc.lineWidth=1.5;pc.stroke();
      text(pc,'F2 · 제2 공진기 중심 주파수 (Hz) →',380,482,'#506173',13,'center');
      pc.save();pc.translate(18,230);pc.rotate(-Math.PI/2);text(pc,'F1 · 제1 공진기 중심 주파수 (Hz) ←',0,0,'#506173',13,'center');pc.restore();
    }
    function smooth(param,value){param.setTargetAtTime(value,audio.ctx.currentTime,.025);}
    function updateAudio(){if(!audio)return;smooth(audio.oscillator.frequency,f0);[f1,f2].forEach((f,i)=>{smooth(audio.filters[i].frequency,f);smooth(audio.filters[i].Q,f/[90,120][i]);smooth(audio.weights[i].gain,Math.min(5,f/550)*[1,.8][i]);});}
    function render(){
      const limited=constrain();text0.textContent=f0;text1.textContent=Math.round(f1);text2.textContent=Math.round(f2);
      limitHint.textContent=limited?'F1 < F2를 유지하도록 경계 안쪽에서 이동을 제한했습니다.':'빨간 영역은 F1 ≥ F2입니다. 점은 경계 안쪽에서 멈춥니다.';
      plot.setAttribute('aria-label','모음 공간. F1 '+Math.round(f1)+' Hz, F2 '+Math.round(f2)+' Hz. 드래그 또는 방향키로 조절. Shift와 방향키는 50 Hz 이동. 빨간 영역 진입 제한.');
      presetButtons.forEach(({button,v})=>button.setAttribute('aria-pressed',String(Math.abs(f1-v.f1)<.01&&Math.abs(f2-v.f2)<.01)));
      drawPlot();updateAudio();
    }
    function move(e){const r=plot.getBoundingClientRect();if(!r.width||!r.height)return;const x=(e.clientX-r.left)*750/r.width,y=(e.clientY-r.top)*500/r.height;f2=500+clamp((x-box.x)/box.w,0,1)*1900;f1=200+clamp((y-box.y)/box.h,0,1)*900;render();}
    plot.addEventListener('pointerdown',e=>{if(pointer!==null||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();pointer=e.pointerId;plot.setPointerCapture(pointer);plot.focus({preventScroll:true});move(e);});
    plot.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e);});
    ['pointerup','pointercancel','lostpointercapture'].forEach(type=>plot.addEventListener(type,e=>{if(e.pointerId!==pointer)return;pointer=null;if(plot.hasPointerCapture(e.pointerId))plot.releasePointerCapture(e.pointerId);}));
    plot.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const d=e.shiftKey?50:10;if(e.key==='ArrowLeft')f2-=d;if(e.key==='ArrowRight')f2+=d;if(e.key==='ArrowUp')f1-=d;if(e.key==='ArrowDown')f1+=d;f1=clamp(f1,...range.f1);f2=clamp(f2,...range.f2);render();});
    vowels.forEach(v=>{
      const button=el('button','','['+v.name+']',presets);button.type='button';button.title=v.ko+' ['+v.name+'] · 예시 F1 '+Math.round(v.f1)+' Hz / F2 '+Math.round(v.f2)+' Hz';button.setAttribute('aria-label',button.title);button.setAttribute('aria-pressed','false');
      presetButtons.push({button,v});button.addEventListener('click',()=>{f1=v.f1;f2=v.f2;render();});
    });
    pitch.addEventListener('input',()=>{f0=clamp(Number(pitch.value),50,120);pitchText.textContent=f0+' Hz';text0.textContent=f0;if(audio)smooth(audio.oscillator.frequency,f0);});


    // AnalyserNode: Blackman 창 + FFT, 스무딩은 끈다.
    // 멜: HTK 2595*log10(1+f/700), 최댓값이 1인 삼각 필터 64개,
    // 정규화하지 않은 가중 파워(POWER) 합(librosa htk=True, norm=None 방식).
    // Analyser dB -> 10^(dB/10) -> 멜 합 -> 10*log10. 주파수축 눈금만 바꾼 것이 아니다.
    // 브라우저의 창 함수/FFT 스케일은 librosa 기본값과 다르며, 보정된 SPL이 아니다.
    const mel=f=>2595*Math.log10(1+f/700),hz=m=>700*(Math.pow(10,m/2595)-1);
    const bands=64,columns=150,history=document.createElement('canvas');history.width=columns;history.height=bands;
    const hc=history.getContext('2d'),column=hc.createImageData(1,bands);
    const anchors=[[9,16,29],[42,34,90],[112,40,117],[190,62,87],[245,130,58],[255,231,151]];
    const palette=Array.from({length:256},(_,i)=>{const p=i/255*(anchors.length-1),j=Math.min(anchors.length-2,Math.floor(p)),a=p-j;return anchors[j].map((v,k)=>Math.round(v*(1-a)+anchors[j+1][k]*a));});
    function makeMelBank(sampleRate,nfft){
      const edges=Array.from({length:bands+2},(_,i)=>hz(mel(4000)*i/(bands+1)));
      return Array.from({length:bands},(_,i)=>{
        const weights=[];for(let k=0;k<nfft/2;k++){const f=k*sampleRate/nfft,w=Math.max(0,Math.min((f-edges[i])/(edges[i+1]-edges[i]),(edges[i+2]-f)/(edges[i+2]-edges[i+1])));if(w>0)weights.push([k,w]);}return weights;
      });
    }
    function clearHistory(){hc.fillStyle='#09101d';hc.fillRect(0,0,columns,bands);lastFrame=-1;drawMel();}
    function drawMel(){
      mc.clearRect(0,0,320,190);mc.imageSmoothingEnabled=false;mc.drawImage(history,42,12,268,126);
      mc.strokeStyle='#9cabb9';mc.lineWidth=1;mc.strokeRect(42,12,268,126);
      [0,500,1000,2000,4000].forEach(f=>{const y=12+126*(1-mel(f)/mel(4000));text(mc,f===0?'0':f/1000+'k',36,y+3,'#506173',10,'right');});
      text(mc,'Hz / mel',4,9,'#506173',8);
      text(mc,'−5 s',42,152,'#506173',10);text(mc,'−2.5 s',176,152,'#506173',10,'center');text(mc,'현재',310,152,'#506173',10,'right');
      const gradient=mc.createLinearGradient(105,0,255,0);anchors.forEach((c,i)=>gradient.addColorStop(i/(anchors.length-1),'rgb('+c.join(',')+')'));mc.fillStyle=gradient;mc.fillRect(105,170,150,5);
      text(mc,'−100',100,177,'#506173',9,'right');text(mc,'−20 dB',260,177,'#506173',9);
    }
    function sampleMel(frame){
      const advance=lastFrame<0?1:Math.min(columns,frame-lastFrame);if(advance<=0)return;
      // 누락된 UI 프레임은 스펙트럼을 복제해 가짜 이력을 만들지 않고 어두운 채로 둔다.
      if(advance<columns)hc.drawImage(history,advance,0,columns-advance,bands,0,0,columns-advance,bands);
      hc.fillStyle='#09101d';hc.fillRect(columns-advance,0,advance,bands);
      audio.analyser.getFloatFrequencyData(audio.spectrum);
      for(let k=0;k<audio.spectrum.length;k++)audio.power[k]=Number.isFinite(audio.spectrum[k])?Math.pow(10,audio.spectrum[k]/10):0;
      audio.bank.forEach((weights,i)=>{let energy=0;for(const [k,w] of weights)energy+=w*audio.power[k];const db=10*Math.log10(Math.max(energy,1e-12)),color=palette[Math.round(clamp((db+100)/80,0,1)*255)],offset=(bands-1-i)*4;column.data[offset]=color[0];column.data[offset+1]=color[1];column.data[offset+2]=color[2];column.data[offset+3]=255;});
      hc.putImageData(column,columns-1,0);lastFrame=frame;drawMel();
    }
    function animate(){
      if(!playing)return;if(!root.isConnected){stop();return;}
      if(audio.ctx.state!=='running'){stop();status.textContent='오디오가 일시 중단되었습니다. 소리 켜기를 다시 눌러 주세요.';return;}
      sampleMel(Math.floor((audio.ctx.currentTime-epoch)*30));raf=requestAnimationFrame(animate);
    }
    function makeGlottalCoefficients(alpha){
      const count=128,real=new Float32Array(count+1),imag=new Float32Array(count+1);
      // Spectral-tilt approximation A_n = 1/n^alpha, not a physical vocal-fold model.
      // Include even AND odd harmonics; DC stays zero. Browser handles band limiting.
      for(let n=1;n<=count;n++)imag[n]=Math.pow(n,-alpha);
      return {real,imag};
    }
    function applyWaveform(ctx,oscillator,waves){
      if(waveform==='sawtooth'||waveform==='square'){oscillator.type=waveform;return;}
      if(!waves.glottal||waves.alpha!==glottalAlpha){
        const {real,imag}=makeGlottalCoefficients(glottalAlpha);
        waves.glottal=ctx.createPeriodicWave(real,imag,{disableNormalization:false});waves.alpha=glottalAlpha;
      }
      oscillator.setPeriodicWave(waves.glottal);
    }
    function initAudio(){
      const Context=window.AudioContext||window.webkitAudioContext;if(!Context)throw new Error('이 브라우저는 Web Audio API를 지원하지 않습니다.');
      const ctx=new Context(),oscillator=ctx.createOscillator(),master=ctx.createGain(),compressor=ctx.createDynamicsCompressor(),analyser=ctx.createAnalyser();
      const waves=Object.create(null);applyWaveform(ctx,oscillator,waves);oscillator.frequency.value=f0;master.gain.value=0;
      compressor.threshold.value=-12;compressor.knee.value=6;compressor.ratio.value=8;compressor.attack.value=.003;compressor.release.value=.15;
      const filters=[],weights=[];
      [f1,f2].forEach((f,i)=>{const filter=ctx.createBiquadFilter(),weight=ctx.createGain();filter.type='bandpass';filter.frequency.value=f;filter.Q.value=f/[90,120][i];weight.gain.value=Math.min(5,f/550)*[1,.8][i];oscillator.connect(filter);filter.connect(weight);weight.connect(compressor);filters.push(filter);weights.push(weight);});
      analyser.fftSize=4096;analyser.smoothingTimeConstant=0;
      // 분석은 컴프레서와 음량 조절 '이후'의 신호로 한다. 들리는 출력 경로는 정확히 하나다.
      compressor.connect(master);master.connect(analyser);analyser.connect(ctx.destination);oscillator.start();
      audio={ctx,oscillator,master,filters,weights,analyser,waves,spectrum:new Float32Array(analyser.frequencyBinCount),power:new Float32Array(analyser.frequencyBinCount),bank:makeMelBank(ctx.sampleRate,analyser.fftSize)};
    }
    function showState(){toggle.textContent=playing?'소리 끄기':'소리 켜기';toggle.setAttribute('aria-pressed',String(playing));live.textContent=playing?'LIVE':'정지';status.textContent=playing?'재생 중 · 모음 위치와 F0를 바꾸며 소리의 변화를 비교해 보세요.':'소리 꺼짐 · 빨간 영역을 제외한 공간에서 자유롭게 움직입니다.';}
    function stop(){playing=false;cancelAnimationFrame(raf);if(audio)smooth(audio.master.gain,0);showState();}
    toggle.addEventListener('click',async()=>{
      if(busy)return;if(playing){stop();return;}busy=true;toggle.disabled=true;
      try{if(!audio)initAudio();await audio.ctx.resume();if(audio.ctx.state!=='running')throw new Error('재생을 시작하지 못했습니다. 다시 눌러 주세요.');if(document.hidden)return;
        document.dispatchEvent(new CustomEvent('svowel-play',{detail:root}));playing=true;updateAudio();smooth(audio.master.gain,Number(volume.value)/100*.6);epoch=audio.ctx.currentTime;clearHistory();showState();animate();
      }catch(error){stop();status.textContent=error.message||'오디오 재생을 시작하지 못했습니다.';}finally{busy=false;toggle.disabled=false;}
    });
    volume.addEventListener('input',()=>{volumeText.textContent=volume.value+'%';if(audio&&playing)smooth(audio.master.gain,Number(volume.value)/100*.6);});
    document.addEventListener('svowel-play',event=>{if(event.detail!==root)stop();});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);
    render();clearHistory();showState();live.textContent='대기';
  });
})();
</script>
